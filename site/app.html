<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Linksketch — golf course design tool</title>
    <meta name="description" content="Linksketch: a Paint-simple pixel-art tool for designing golf courses, with real yardages, terrain and strategy." />
    <meta name="theme-color" content="#000080" />
    <link rel="manifest" href="/linksketch/app/manifest.webmanifest" />
    <link rel="icon" href="/icons/linksketch.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/linksketch-180.png" />
  </head>
  <body>
    <div id="app">
      <div id="menubar"></div>
      <div id="main">
        <div id="left" class="chrome">
          <div id="toolbox"></div>
          <div id="tool-options"></div>
        </div>
        <div id="workspace"><canvas id="view" tabindex="0"></canvas></div>
        <div id="right" class="chrome">
          <div class="panel" id="layers-panel"></div>
          <div class="panel" id="info-panel"></div>
          <div class="panel" id="scorecard-panel"></div>
        </div>
      </div>
      <div id="palette" class="chrome"></div>
      <div id="statusbar"></div>
    </div>
    <script type="module" src="%SRC%/main.ts"></script>
  </body>
</html>
